name: Build desktop app

on:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        working-directory: scubby
        run: npm install
      - name: Build
        working-directory: scubby
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: steel-wool-windows-installer
          path: scubby/dist/*.exe
