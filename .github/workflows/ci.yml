name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check JavaScript
        working-directory: scubby
        run: npm run check
      - name: Check Python
        run: python -m py_compile scubby/proxy.py scubby/scrubber.py
